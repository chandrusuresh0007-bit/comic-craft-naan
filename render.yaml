services:
  - type: web
    name: pocketsmart-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: ENVIRONMENT
        value: production

      - key: AI_PROVIDER
        value: gemini

      - key: GEMINI_MODEL
        value: gemini-1.5-flash

      - key: GEMINI_API_KEY
        sync: false

      - key: SESSION_SECRET
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: COOKIE_SECURE
        value: "true"

      - key: ALLOWED_ORIGINS
        sync: false
